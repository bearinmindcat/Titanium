name: Feature / patch request
description: Suggest a hardening/privacy patch or feature
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes: { label: What & why, description: "The change and its security/privacy rationale" }
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: Upstream source (if any), description: "e.g. a Cromite/Brave patch name" }
