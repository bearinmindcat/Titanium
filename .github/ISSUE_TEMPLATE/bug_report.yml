name: Bug report
description: Report a bug in Titanium-test
labels: ["bug"]
body:
  - type: input
    id: version
    attributes: { label: Version, description: "Chromium/Titanium version (chrome://version)" }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Linux, Windows, macOS, Other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened?, description: "Steps to reproduce + expected vs actual" }
    validations: { required: true }
  - type: input
    id: flags
    attributes: { label: Relevant chrome://flags, description: "e.g. timezone-spoofing, spoof-webgl-info state" }
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - { label: "I reproduced this on a clean profile", required: false }
        - { label: "This is not an upstream Chromium/ungoogled-chromium bug", required: false }
