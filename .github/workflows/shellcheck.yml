name: Shellcheck
# Lints the project's own shell scripts (tools/). UGC's vendored utils/devutils
# are excluded — they're upstream and linted by UGC, not here.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck tools/
        run: shellcheck -S warning tools/*.sh
